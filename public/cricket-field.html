<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cricket Field — Slog Overs</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #102017;
    color: #e6efe9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  header {
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    letter-spacing: 0.5px;
  }
  header .meta {
    font-size: 13px;
    opacity: 0.75;
  }

  .legend {
    padding: 0 24px 12px;
    font-size: 12px;
    opacity: 0.8;
  }
  .legend span { margin-right: 16px; }
  .legend .swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    vertical-align: middle;
    margin-right: 6px;
  }

  .stage {
    position: relative;
    width: min(100%, 880px);
    aspect-ratio: 8 / 9;
    margin: 0 auto 32px;
  }

  svg.field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .fielder {
    position: absolute;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    z-index: 4;
  }
  .fielder.dragging { z-index: 10; }

  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffd23f;
    border: 2px solid #0e2a14;
    box-shadow: 0 1px 2px rgba(0,0,0,0.45);
    cursor: grab;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.18s ease;
  }
  .dot:hover { transform: scale(1.15); }
  .fielder.dragging .dot {
    cursor: grabbing;
    transform: scale(1.3);
    box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  }
  .fielder[data-zone="keeper"]   .dot { background: #ff6b6b; }
  .fielder[data-zone="bowler"]   .dot { background: #6bb6ff; }
  .fielder[data-zone="ring"]     .dot { background: #b8e986; }
  .fielder[data-zone="boundary"] .dot { background: #ffd23f; }
  .fielder[data-zone="pitch"]    .dot { background: #ffffff; }

  /* Player name — static, always visible below the dot */
  .player-name {
    position: absolute;
    left: 50%;
    top: calc(100% + 4px);
    transform: translateX(-50%);
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    text-shadow:
      0 0 3px rgba(0,0,0,0.95),
      0 1px 2px rgba(0,0,0,0.95),
      0 0 1px rgba(0,0,0,0.95);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: 0.2px;
  }

  /* Position label — auto-detected, sits above the dot */
  .position-label {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 4px);
    transform: translateX(-50%);
    background: rgba(15, 30, 22, 0.78);
    color: #f0f6f1;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0.85;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
  }
  .fielder.dragging .position-label {
    background: #ffd23f;
    color: #1a1a1a;
    border-color: #1a1a1a;
    opacity: 1;
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  .fielder:hover .position-label { opacity: 1; }

  footer {
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    padding: 8px 16px 24px;
  }

  @media print {
    body { background: white; color: black; }
    header, footer, .legend { display: none; }
    .stage { margin: 0 auto; }
    .player-name { color: #111; text-shadow: none; }
    .position-label { background: #fff; color: #111; border-color: #111; opacity: 1; }
    .dot { transform: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Cricket Field — Slog Overs</h1>
  <span class="meta">Right-handed batter · bowling from the bottom end · drag any player; the position re-labels automatically</span>
</header>

<div class="legend">
  <span><span class="swatch" style="background:#ff6b6b"></span>Wicketkeeper zone</span>
  <span><span class="swatch" style="background:#6bb6ff"></span>Bowler zone</span>
  <span><span class="swatch" style="background:#b8e986"></span>Inside the ring</span>
  <span><span class="swatch" style="background:#ffd23f"></span>Boundary</span>
</div>

<div class="stage">
  <svg class="field" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" aria-label="Cricket field">
    <ellipse cx="400" cy="450" rx="380" ry="430" fill="#2f7a3a" stroke="#ffffff" stroke-width="3" />
    <g opacity="0.18">
      <ellipse cx="400" cy="450" rx="320" ry="362" fill="#2a6f34" />
      <ellipse cx="400" cy="450" rx="240" ry="272" fill="#2f7a3a" />
      <ellipse cx="400" cy="450" rx="180" ry="204" fill="#2a6f34" />
    </g>
    <circle cx="400" cy="450" r="160" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.85" />
    <rect x="386" y="360" width="28" height="180" fill="#c8a26a" stroke="#a07e4d" stroke-width="1.5" />
    <line x1="378" y1="360" x2="422" y2="360" stroke="#f5f5dc" stroke-width="1.5" />
    <line x1="378" y1="540" x2="422" y2="540" stroke="#f5f5dc" stroke-width="1.5" />
    <line x1="372" y1="378" x2="428" y2="378" stroke="#f5f5dc" stroke-width="1" />
    <line x1="372" y1="522" x2="428" y2="522" stroke="#f5f5dc" stroke-width="1" />
    <g fill="#efe7d2">
      <rect x="397" y="357" width="2" height="6" />
      <rect x="400" y="357" width="2" height="6" />
      <rect x="403" y="357" width="2" height="6" />
      <rect x="397" y="537" width="2" height="6" />
      <rect x="400" y="537" width="2" height="6" />
      <rect x="403" y="537" width="2" height="6" />
    </g>
    <text x="40"  y="455" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="start" font-family="sans-serif">OFF SIDE</text>
    <text x="760" y="455" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="end"   font-family="sans-serif">LEG SIDE</text>
    <text x="400" y="32"  font-size="12" fill="#ffffff" opacity="0.6" text-anchor="middle" font-family="sans-serif">BATTER'S END</text>
    <text x="400" y="880" font-size="12" fill="#ffffff" opacity="0.6" text-anchor="middle" font-family="sans-serif">BOWLER'S END</text>
  </svg>

  <!--
    11 players. The name attribute is static; the position label is
    computed by JS on init and on every drag move.
  -->
  <div class="fielder" data-name="Baljit"   style="left:50.0%; top:62.0%;"></div>
  <div class="fielder" data-name="Ankush"   style="left:50.0%; top:35.5%;"></div>
  <div class="fielder" data-name="Akhil"    style="left:33.0%; top:86.0%;"></div>
  <div class="fielder" data-name="Ranjith"  style="left:67.0%; top:86.0%;"></div>
  <div class="fielder" data-name="Mirza"    style="left:88.0%; top:57.0%;"></div>
  <div class="fielder" data-name="Harsh"    style="left:12.0%; top:57.0%;"></div>
  <div class="fielder" data-name="Jithesh"  style="left:14.0%; top:28.0%;"></div>
  <div class="fielder" data-name="Shishir"  style="left:39.5%; top:53.5%;"></div>
  <div class="fielder" data-name="Saurabh"  style="left:60.5%; top:53.5%;"></div>
  <div class="fielder" data-name="Nikmal"   style="left:35.0%; top:46.0%;"></div>
  <div class="fielder" data-name="Abdullah" style="left:65.0%; top:42.0%;"></div>

</div>

<footer>
  Drag a player to reposition · the label above each dot updates to the cricket position automatically
</footer>

<script>
(function () {
  const stage = document.querySelector('.stage');
  const fielders = document.querySelectorAll('.fielder');
  const DRAG_THRESHOLD = 3;

  // --- Build the inner DOM for each fielder (dot, position label, name)
  fielders.forEach(f => {
    const dot = document.createElement('div');
    dot.className = 'dot';

    const pos = document.createElement('div');
    pos.className = 'position-label';

    const name = document.createElement('div');
    name.className = 'player-name';
    name.textContent = f.dataset.name || '';

    f.appendChild(dot);
    f.appendChild(pos);
    f.appendChild(name);
  });

  // --- Map (left%, top%) to a cricket position name + zone class
  // Field viewBox is 800x900. Center (400, 450). Inner ring r=160. Pitch x:[386,414], y:[360,540].
  // RHB at top end facing the bowler at the bottom end:
  //   - Off side  = screen LEFT  (x < 400)
  //   - Leg side  = screen RIGHT (x > 400)
  //   - Forward   = larger y (toward bowler at bottom)
  //   - Behind    = smaller y (behind batter at top)
  function detectPosition(xPct, yPct) {
    const vbX = (xPct / 100) * 800;
    const vbY = (yPct / 100) * 900;

    // Pitch / keeper / bowler special zones
    if (vbY < 360 && Math.abs(vbX - 400) < 60) {
      return { label: 'Wicketkeeper', zone: 'keeper' };
    }
    if (vbX > 380 && vbX < 420) {
      if (vbY >= 360 && vbY <= 470) return { label: 'On the Pitch (Batter’s End)', zone: 'pitch' };
      if (vbY > 470 && vbY <= 560)  return { label: 'Bowler', zone: 'bowler' };
      if (vbY > 560 && vbY <= 620)  return { label: 'Bowler', zone: 'bowler' };
    }

    const dx = vbX - 400;
    const dy = vbY - 450;
    const distFromCenter = Math.sqrt(dx * dx + dy * dy);

    // Angle from the batter's stance (batter near y=380 at top end).
    // 0° = straight ahead toward the bowler (down on screen).
    // +ve angle = OFF side (screen left), −ve = LEG side (screen right).
    const ax = vbX - 400;
    const ay = vbY - 380;
    const angle = -Math.atan2(ax, ay) * 180 / Math.PI; // -180..180

    const inRing = distFromCenter < 165;
    const zone = inRing ? 'ring' : 'boundary';

    let label;
    if (inRing) {
      if (angle >= -22.5 && angle < 22.5)         label = ax < 0 ? 'Mid Off' : 'Mid On';
      else if (angle >= 22.5 && angle < 67.5)     label = 'Cover';
      else if (angle >= 67.5 && angle < 112.5)    label = 'Point';
      else if (angle >= 112.5 && angle < 157.5)   label = 'Backward Point';
      else if (angle >= 157.5 || angle < -157.5)  label = 'Slip';
      else if (angle >= -67.5 && angle < -22.5)   label = 'Midwicket';
      else if (angle >= -112.5 && angle < -67.5)  label = 'Square Leg';
      else if (angle >= -157.5 && angle < -112.5) label = 'Short Fine Leg';
    } else {
      if (angle >= -22.5 && angle < 22.5)         label = ax < 0 ? 'Long Off' : 'Long On';
      else if (angle >= 22.5 && angle < 67.5)     label = 'Deep Cover';
      else if (angle >= 67.5 && angle < 112.5)    label = 'Sweeper Cover';
      else if (angle >= 112.5 && angle < 157.5)   label = 'Deep Backward Point';
      else if (angle >= 157.5 || angle < -157.5)  label = 'Third Man';
      else if (angle >= -67.5 && angle < -22.5)   label = 'Deep Midwicket';
      else if (angle >= -112.5 && angle < -67.5)  label = 'Deep Square Leg';
      else if (angle >= -157.5 && angle < -112.5) label = 'Deep Fine Leg';
    }
    return { label, zone };
  }

  function updateFielder(f) {
    const xPct = parseFloat(f.style.left);
    const yPct = parseFloat(f.style.top);
    const { label, zone } = detectPosition(xPct, yPct);
    f.dataset.zone = zone;
    f.querySelector('.position-label').textContent = label;
  }

  // Initial labels
  fielders.forEach(updateFielder);

  // --- Drag handling (pointer events, mouse + touch)
  let active = null;
  let didDrag = false;
  let startX = 0, startY = 0;
  let offsetX = 0, offsetY = 0;

  fielders.forEach(f => {
    const dot = f.querySelector('.dot');

    dot.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      active = f;
      didDrag = false;
      startX = e.clientX;
      startY = e.clientY;

      const rect = stage.getBoundingClientRect();
      const curX = (parseFloat(f.style.left) / 100) * rect.width;
      const curY = (parseFloat(f.style.top)  / 100) * rect.height;
      offsetX = (e.clientX - rect.left) - curX;
      offsetY = (e.clientY - rect.top)  - curY;

      f.classList.add('dragging');
      try { dot.setPointerCapture(e.pointerId); } catch (_) {}
    });

    dot.addEventListener('pointermove', (e) => {
      if (active !== f) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!didDrag && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
        didDrag = true;
      }
      if (!didDrag) return;

      const rect = stage.getBoundingClientRect();
      const newX = (e.clientX - rect.left) - offsetX;
      const newY = (e.clientY - rect.top)  - offsetY;
      // Clamp slightly inside so labels don't fall off the stage
      const pctX = Math.max(2, Math.min(98, (newX / rect.width)  * 100));
      const pctY = Math.max(4, Math.min(96, (newY / rect.height) * 100));
      f.style.left = pctX + '%';
      f.style.top  = pctY + '%';
      updateFielder(f);
    });

    function endDrag(e) {
      if (active !== f) return;
      try { dot.releasePointerCapture(e.pointerId); } catch (_) {}
      f.classList.remove('dragging');
      updateFielder(f);
      active = null;
    }

    dot.addEventListener('pointerup', endDrag);
    dot.addEventListener('pointercancel', endDrag);
  });
})();
</script>

</body>
</html>
