<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cricket Field — CVZ Field Placement</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #102017;
    color: #e6efe9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Compact top bar — one row with title + phase + bowler + count */
  .top-bar {
    max-width: 880px;
    margin: 8px auto 6px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    font-size: 12px;
  }
  .top-bar h1 {
    font-size: 13px;
    margin: 0;
    letter-spacing: 0.3px;
    font-weight: 700;
    white-space: nowrap;
  }
  .top-bar .sep {
    width: 1px;
    height: 18px;
    background: rgba(255,255,255,0.12);
  }

  .phase-toggle {
    display: inline-flex;
    background: rgba(0,0,0,0.35);
    border-radius: 999px;
    padding: 2px;
  }
  .phase-toggle button {
    padding: 3px 9px;
    border: none;
    background: transparent;
    color: #cfd8d3;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .phase-toggle button:hover { color: #fff; }
  .phase-toggle button.active { color: #1a1a1a; }
  .phase-toggle button.active[data-phase="powerplay"]     { background: #ff8a4d; }
  .phase-toggle button.active[data-phase="non-powerplay"] { background: #b8e986; }

  .bowler-picker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .bowler-picker label {
    text-transform: uppercase;
    letter-spacing: 0.4px;
    opacity: 0.7;
    font-weight: 600;
    font-size: 10px;
  }
  .bowler-picker select {
    background: rgba(0,0,0,0.45);
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    outline: none;
  }
  .bowler-picker select:focus { border-color: #ff6b6b; }
  .bowler-picker .bowler-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 107, 107, 0.18);
    border: 1px solid rgba(255, 107, 107, 0.55);
    color: #ffd6d6;
    border-radius: 999px;
    padding: 2px 8px 2px 7px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .bowler-picker .bowler-pill::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff4d4d;
    box-shadow: 0 0 5px #ff4d4d;
  }
  .bowler-picker .keeper-pill {
    background: rgba(45, 212, 191, 0.18);
    border-color: rgba(45, 212, 191, 0.55);
    color: #b6f0e8;
  }
  .bowler-picker .keeper-pill::before {
    background: #2dd4bf;
    box-shadow: 0 0 5px #2dd4bf;
  }

  .top-bar .spacer { flex: 1; }
  .field-count {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    opacity: 0.8;
    white-space: nowrap;
  }
  .field-count .num { font-weight: 700; opacity: 1; color: #fff; }
  .field-count.over-limit .num { color: #ff6b6b; }

  .stage {
    position: relative;
    width: min(100%, 880px);
    aspect-ratio: 8 / 9;
    margin: 0 auto 8px;
  }

  svg.field {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .fielder {
    position: absolute;
    width: 22px;
    height: 22px;
    transform: translate(-50%, -50%);
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    z-index: 4;
    transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .fielder.dragging { z-index: 10; transition: none; }

  .dot {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffd23f;
    border: 2px solid #0e2a14;
    box-shadow: 0 1px 2px rgba(0,0,0,0.45);
    cursor: grab;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.18s ease;
  }
  .dot:hover { transform: scale(1.15); }
  .fielder.dragging .dot {
    cursor: grabbing;
    transform: scale(1.3);
    box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  }
  .fielder[data-zone="keeper"]   .dot { background: #ff6b6b; }
  .fielder[data-zone="bowler"]   .dot { background: #6bb6ff; }
  .fielder[data-zone="ring"]     .dot { background: #b8e986; }
  .fielder[data-zone="boundary"] .dot { background: #ffd23f; }
  .fielder[data-zone="pitch"]    .dot { background: #ffffff; }

  /* Highlight the selected bowler */
  .fielder.is-bowler .dot {
    box-shadow:
      0 0 0 2px #ffffff,
      0 0 0 4px #ff4d4d,
      0 0 14px rgba(255, 77, 77, 0.7);
  }
  .fielder.is-bowler .player-name {
    color: #ffd6d6;
    text-shadow:
      0 0 4px #ff4d4d,
      0 0 3px rgba(0,0,0,0.95),
      0 1px 2px rgba(0,0,0,0.95);
  }

  /* Highlight the selected keeper */
  .fielder.is-keeper .dot {
    box-shadow:
      0 0 0 2px #ffffff,
      0 0 0 4px #2dd4bf,
      0 0 14px rgba(45, 212, 191, 0.65);
  }
  .fielder.is-keeper .player-name {
    color: #b6f0e8;
    text-shadow:
      0 0 4px #2dd4bf,
      0 0 3px rgba(0,0,0,0.95),
      0 1px 2px rgba(0,0,0,0.95);
  }
  /* If somehow a player ends up tagged as both, bowler styling wins */
  .fielder.is-bowler.is-keeper .dot {
    box-shadow:
      0 0 0 2px #ffffff,
      0 0 0 4px #ff4d4d,
      0 0 14px rgba(255, 77, 77, 0.7);
  }

  /* Player name — static, always visible below the dot */
  .player-name {
    position: absolute;
    left: 50%;
    top: calc(100% + 3px);
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    text-shadow:
      0 0 3px rgba(0,0,0,0.95),
      0 1px 2px rgba(0,0,0,0.95),
      0 0 1px rgba(0,0,0,0.95);
    white-space: nowrap;
    pointer-events: none;
    letter-spacing: 0.2px;
    line-height: 1.1;
  }

  /* Position label — auto-detected, sits above the dot */
  .position-label {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 3px);
    transform: translateX(-50%);
    background: rgba(15, 30, 22, 0.78);
    color: #f0f6f1;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 3px;
    padding: 0 5px;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0.85;
    line-height: 1.5;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
  }
  .fielder.dragging .position-label {
    background: #ffd23f;
    color: #1a1a1a;
    border-color: #1a1a1a;
    opacity: 1;
    transform: translateX(-50%) scale(1.08);
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
  }
  .fielder:hover .position-label { opacity: 1; }

  @media print {
    body { background: white; color: black; }
    .top-bar { background: #f4f4f4; border-color: #ccc; color: #111; }
    .top-bar h1 { color: #111; }
    .stage { margin: 0 auto; }
    .player-name { color: #111; text-shadow: none; }
    .position-label { background: #fff; color: #111; border-color: #111; opacity: 1; }
    .dot { transform: none !important; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>CVZ Field Placement</h1>
  <span class="sep"></span>
  <div class="phase-toggle" role="tablist" aria-label="Innings phase">
    <button type="button" data-phase="powerplay">Powerplay</button>
    <button type="button" data-phase="non-powerplay" class="active">Non-PP</button>
  </div>
  <span class="sep"></span>
  <div class="bowler-picker">
    <label for="keeper-select">Keeper</label>
    <select id="keeper-select"></select>
    <span class="bowler-pill keeper-pill" id="keeper-pill">—</span>
  </div>
  <span class="sep"></span>
  <div class="bowler-picker">
    <label for="bowler-select">Bowler</label>
    <select id="bowler-select"></select>
    <span class="bowler-pill" id="bowler-pill">—</span>
  </div>
  <span class="spacer"></span>
  <div class="field-count" id="field-count">
    Outside: <span class="num" id="outside-count">0</span> / <span id="outside-limit">5</span>
  </div>
</div>

<div class="stage">
  <svg class="field" viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" aria-label="Cricket field">
    <ellipse cx="400" cy="450" rx="380" ry="430" fill="#2f7a3a" stroke="#ffffff" stroke-width="3" />
    <g opacity="0.18">
      <ellipse cx="400" cy="450" rx="320" ry="362" fill="#2a6f34" />
      <ellipse cx="400" cy="450" rx="240" ry="272" fill="#2f7a3a" />
      <ellipse cx="400" cy="450" rx="180" ry="204" fill="#2a6f34" />
    </g>
    <circle cx="400" cy="450" r="160" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" opacity="0.85" />
    <rect x="386" y="360" width="28" height="180" fill="#c8a26a" stroke="#a07e4d" stroke-width="1.5" />
    <line x1="378" y1="360" x2="422" y2="360" stroke="#f5f5dc" stroke-width="1.5" />
    <line x1="378" y1="540" x2="422" y2="540" stroke="#f5f5dc" stroke-width="1.5" />
    <line x1="372" y1="378" x2="428" y2="378" stroke="#f5f5dc" stroke-width="1" />
    <line x1="372" y1="522" x2="428" y2="522" stroke="#f5f5dc" stroke-width="1" />
    <g fill="#efe7d2">
      <rect x="397" y="357" width="2" height="6" />
      <rect x="400" y="357" width="2" height="6" />
      <rect x="403" y="357" width="2" height="6" />
      <rect x="397" y="537" width="2" height="6" />
      <rect x="400" y="537" width="2" height="6" />
      <rect x="403" y="537" width="2" height="6" />
    </g>
    <text x="40"  y="455" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="start" font-family="sans-serif">OFF SIDE</text>
    <text x="760" y="455" font-size="14" fill="#ffffff" opacity="0.7" text-anchor="end"   font-family="sans-serif">LEG SIDE</text>
    <text x="400" y="32"  font-size="12" fill="#ffffff" opacity="0.6" text-anchor="middle" font-family="sans-serif">BATTER'S END</text>
    <text x="400" y="880" font-size="12" fill="#ffffff" opacity="0.6" text-anchor="middle" font-family="sans-serif">BOWLER'S END</text>
  </svg>

  <!--
    11 players. The name attribute is static; the position label is
    computed by JS on init and on every drag move.
  -->
  <div class="fielder" data-name="Baljit"   style="left:50.0%; top:62.0%;"></div>
  <div class="fielder" data-name="Ankush"   style="left:50.0%; top:35.5%;"></div>
  <div class="fielder" data-name="Akhil"    style="left:33.0%; top:86.0%;"></div>
  <div class="fielder" data-name="Ranjith"  style="left:67.0%; top:86.0%;"></div>
  <div class="fielder" data-name="Mirza"    style="left:88.0%; top:57.0%;"></div>
  <div class="fielder" data-name="Harsh"    style="left:12.0%; top:57.0%;"></div>
  <div class="fielder" data-name="Jithesh"  style="left:14.0%; top:28.0%;"></div>
  <div class="fielder" data-name="Shishir"  style="left:39.5%; top:53.5%;"></div>
  <div class="fielder" data-name="Saurabh"  style="left:60.5%; top:53.5%;"></div>
  <div class="fielder" data-name="Nikmal"   style="left:35.0%; top:46.0%;"></div>
  <div class="fielder" data-name="Abdullah" style="left:65.0%; top:42.0%;"></div>

</div>


<script>
(function () {
  const stage = document.querySelector('.stage');
  const fielders = document.querySelectorAll('.fielder');
  const DRAG_THRESHOLD = 3;

  // --- Build the inner DOM for each fielder (dot, position label, name)
  fielders.forEach(f => {
    const dot = document.createElement('div');
    dot.className = 'dot';

    const pos = document.createElement('div');
    pos.className = 'position-label';

    const name = document.createElement('div');
    name.className = 'player-name';
    name.textContent = f.dataset.name || '';

    f.appendChild(dot);
    f.appendChild(pos);
    f.appendChild(name);
  });

  // --- Map (left%, top%) to a cricket position name + zone class
  // Field viewBox is 800x900. Center (400, 450). Inner ring r=160. Pitch x:[386,414], y:[360,540].
  // RHB at top end facing the bowler at the bottom end:
  //   - Off side  = screen LEFT  (x < 400)
  //   - Leg side  = screen RIGHT (x > 400)
  //   - Forward   = larger y (toward bowler at bottom)
  //   - Behind    = smaller y (behind batter at top)
  function detectPosition(xPct, yPct) {
    const vbX = (xPct / 100) * 800;
    const vbY = (yPct / 100) * 900;

    // Pitch / keeper / bowler special zones
    if (vbY < 360 && Math.abs(vbX - 400) < 60) {
      return { label: 'Wicketkeeper', zone: 'keeper' };
    }
    if (vbX > 380 && vbX < 420) {
      if (vbY >= 360 && vbY <= 470) return { label: 'On the Pitch (Batter’s End)', zone: 'pitch' };
      if (vbY > 470 && vbY <= 560)  return { label: 'Bowler', zone: 'bowler' };
      if (vbY > 560 && vbY <= 620)  return { label: 'Bowler', zone: 'bowler' };
    }

    const dx = vbX - 400;
    const dy = vbY - 450;
    const distFromCenter = Math.sqrt(dx * dx + dy * dy);

    // Angle from the batter's stance (batter near y=380 at top end).
    // 0° = straight ahead toward the bowler (down on screen).
    // +ve angle = OFF side (screen left), −ve = LEG side (screen right).
    const ax = vbX - 400;
    const ay = vbY - 380;
    const angle = -Math.atan2(ax, ay) * 180 / Math.PI; // -180..180

    const inRing = distFromCenter < 165;
    const zone = inRing ? 'ring' : 'boundary';

    let label;
    if (inRing) {
      if (angle >= -22.5 && angle < 22.5)         label = ax < 0 ? 'Mid Off' : 'Mid On';
      else if (angle >= 22.5 && angle < 67.5)     label = 'Cover';
      else if (angle >= 67.5 && angle < 112.5)    label = 'Point';
      else if (angle >= 112.5 && angle < 157.5)   label = 'Backward Point';
      else if (angle >= 157.5 || angle < -157.5)  label = 'Slip';
      else if (angle >= -67.5 && angle < -22.5)   label = 'Midwicket';
      else if (angle >= -112.5 && angle < -67.5)  label = 'Square Leg';
      else if (angle >= -157.5 && angle < -112.5) label = 'Short Fine Leg';
    } else {
      if (angle >= -22.5 && angle < 22.5)         label = ax < 0 ? 'Long Off' : 'Long On';
      else if (angle >= 22.5 && angle < 67.5)     label = 'Deep Cover';
      else if (angle >= 67.5 && angle < 112.5)    label = 'Sweeper Cover';
      else if (angle >= 112.5 && angle < 157.5)   label = 'Deep Backward Point';
      else if (angle >= 157.5 || angle < -157.5)  label = 'Third Man';
      else if (angle >= -67.5 && angle < -22.5)   label = 'Deep Midwicket';
      else if (angle >= -112.5 && angle < -67.5)  label = 'Deep Square Leg';
      else if (angle >= -157.5 && angle < -112.5) label = 'Deep Fine Leg';
    }
    return { label, zone };
  }

  // --- Phase + bowler/keeper controls (declared before initial render so updateFielder can use them)
  const phaseButtons = document.querySelectorAll('.phase-toggle button');
  const bowlerSelect = document.getElementById('bowler-select');
  const bowlerPill   = document.getElementById('bowler-pill');
  const keeperSelect = document.getElementById('keeper-select');
  const keeperPill   = document.getElementById('keeper-pill');
  const outsideCount = document.getElementById('outside-count');
  const outsideLimit = document.getElementById('outside-limit');
  const fieldCountEl = document.getElementById('field-count');

  let currentPhase = 'non-powerplay'; // default for CVZ field placement
  function phaseLimit() { return currentPhase === 'powerplay' ? 2 : 5; }

  function refreshOutsideCount() {
    let n = 0;
    fielders.forEach(f => {
      if (f.dataset.zone === 'boundary') n++;
    });
    outsideCount.textContent = n;
    outsideLimit.textContent = phaseLimit();
    fieldCountEl.classList.toggle('over-limit', n > phaseLimit());
  }

  function updateFielder(f) {
    const xPct = parseFloat(f.style.left);
    const yPct = parseFloat(f.style.top);
    const { label, zone } = detectPosition(xPct, yPct);
    f.dataset.zone = zone;
    f.querySelector('.position-label').textContent = label;
    refreshOutsideCount();
  }

  // Initial labels (now safe — count elements are bound)
  fielders.forEach(updateFielder);

  phaseButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      phaseButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentPhase = btn.dataset.phase;
      refreshOutsideCount();
    });
  });

  // Anchor spots for the two role players
  const BOWLER_SPOT = { left: 50.0, top: 62.0 };
  const KEEPER_SPOT = { left: 50.0, top: 35.5 };

  function findByName(name)   { return Array.from(fielders).find(f => f.dataset.name === name) || null; }
  function getBowlerName()    { return Array.from(fielders).find(f => f.classList.contains('is-bowler'))?.dataset.name || null; }
  function getKeeperName()    { return Array.from(fielders).find(f => f.classList.contains('is-keeper'))?.dataset.name || null; }

  // Move `subject` to (left%, top%); the player currently at that anchor (if any
  // and different) takes subject's old position. Refreshes labels for both.
  function placeAtAnchor(subject, anchor, prev) {
    if (!subject || subject === prev) return;
    const oldLeft = subject.style.left;
    const oldTop  = subject.style.top;
    subject.style.left = anchor.left + '%';
    subject.style.top  = anchor.top  + '%';
    if (prev) {
      prev.style.left = oldLeft;
      prev.style.top  = oldTop;
      updateFielder(prev);
    }
    updateFielder(subject);
  }

  function setBowler(name) {
    if (!name) return;
    if (name === getKeeperName()) return; // safety: can't bowl and keep
    const newBowler  = findByName(name);
    const prevBowler = findByName(getBowlerName());
    placeAtAnchor(newBowler, BOWLER_SPOT, prevBowler);
    fielders.forEach(f => f.classList.toggle('is-bowler', f.dataset.name === name));
    bowlerPill.textContent = name;
    populateKeeperOptions();
  }

  function setKeeper(name) {
    if (!name) return;
    if (name === getBowlerName()) return; // safety: can't keep and bowl
    const newKeeper  = findByName(name);
    const prevKeeper = findByName(getKeeperName());
    placeAtAnchor(newKeeper, KEEPER_SPOT, prevKeeper);
    fielders.forEach(f => f.classList.toggle('is-keeper', f.dataset.name === name));
    keeperPill.textContent = name;
    populateBowlerOptions();
  }

  function populateOptions(selectEl, excludeName) {
    const prev = selectEl.value;
    selectEl.innerHTML = '';
    fielders.forEach(f => {
      if (f.dataset.name === excludeName) return;
      const opt = document.createElement('option');
      opt.value = f.dataset.name;
      opt.textContent = f.dataset.name;
      selectEl.appendChild(opt);
    });
    if (prev && Array.from(selectEl.options).some(o => o.value === prev)) {
      selectEl.value = prev;
    }
  }
  function populateBowlerOptions() { populateOptions(bowlerSelect, getKeeperName()); }
  function populateKeeperOptions() { populateOptions(keeperSelect, getBowlerName()); }

  // --- Initial roles
  // Default keeper = whichever player starts in the keeper zone (Ankush);
  // default bowler = whichever player starts in the bowler zone (Baljit).
  const initialKeeper =
    Array.from(fielders).find(f => f.dataset.zone === 'keeper')?.dataset.name
    || fielders[0]?.dataset.name;
  const initialBowler =
    Array.from(fielders).find(f => f.dataset.zone === 'bowler')?.dataset.name
    || fielders.find(f => f.dataset.name !== initialKeeper)?.dataset.name;

  // Build dropdowns with no exclusions yet, then set the roles which will refresh them.
  populateOptions(keeperSelect, null);
  populateOptions(bowlerSelect, null);

  keeperSelect.value = initialKeeper;
  setKeeper(initialKeeper);

  bowlerSelect.value = initialBowler;
  setBowler(initialBowler);

  keeperSelect.addEventListener('change', () => setKeeper(keeperSelect.value));
  bowlerSelect.addEventListener('change', () => setBowler(bowlerSelect.value));

  // --- Drag handling (pointer events, mouse + touch)
  let active = null;
  let didDrag = false;
  let startX = 0, startY = 0;
  let offsetX = 0, offsetY = 0;

  fielders.forEach(f => {
    const dot = f.querySelector('.dot');

    dot.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      active = f;
      didDrag = false;
      startX = e.clientX;
      startY = e.clientY;

      const rect = stage.getBoundingClientRect();
      const curX = (parseFloat(f.style.left) / 100) * rect.width;
      const curY = (parseFloat(f.style.top)  / 100) * rect.height;
      offsetX = (e.clientX - rect.left) - curX;
      offsetY = (e.clientY - rect.top)  - curY;

      f.classList.add('dragging');
      try { dot.setPointerCapture(e.pointerId); } catch (_) {}
    });

    dot.addEventListener('pointermove', (e) => {
      if (active !== f) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!didDrag && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
        didDrag = true;
      }
      if (!didDrag) return;

      const rect = stage.getBoundingClientRect();
      const newX = (e.clientX - rect.left) - offsetX;
      const newY = (e.clientY - rect.top)  - offsetY;
      // Clamp slightly inside so labels don't fall off the stage
      const pctX = Math.max(2, Math.min(98, (newX / rect.width)  * 100));
      const pctY = Math.max(4, Math.min(96, (newY / rect.height) * 100));
      f.style.left = pctX + '%';
      f.style.top  = pctY + '%';
      updateFielder(f);
    });

    function endDrag(e) {
      if (active !== f) return;
      try { dot.releasePointerCapture(e.pointerId); } catch (_) {}
      f.classList.remove('dragging');
      updateFielder(f);
      active = null;
    }

    dot.addEventListener('pointerup', endDrag);
    dot.addEventListener('pointercancel', endDrag);
  });
})();
</script>

</body>
</html>
