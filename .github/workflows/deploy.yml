name: Deploy to Cloudflare Pages

# Runs on every push to main, or manually from the Actions tab ("Run workflow").
# One-time setup (see README "Go live" section):
#   1. Create a free Cloudflare account
#   2. Add two repository secrets:
#      CLOUDFLARE_API_TOKEN  — API token with Cloudflare Pages + D1 edit permissions
#      CLOUDFLARE_ACCOUNT_ID — shown on the Cloudflare dashboard's overview page
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that the Cloudflare secrets are configured
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under: repo Settings → Secrets and variables → Actions → New repository secret."
            echo "See the 'Go live' section of README.md for how to get both values from the Cloudflare dashboard."
            exit 1
          fi

      - name: Normalize and validate the secrets
        run: |
          TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          ACCOUNT=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT" >> "$GITHUB_ENV"
          if ! printf '%s' "$ACCOUNT" | grep -qiE '^[0-9a-f]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID does not look like a Cloudflare Account ID (must be exactly 32 characters, only digits and letters a-f)."
            echo "Find it at dash.cloudflare.com: open Workers & Pages and copy 'Account ID' from the right sidebar."
            echo "Then update the secret: repo Settings → Secrets and variables → Actions → CLOUDFLARE_ACCOUNT_ID (pencil icon)."
            exit 1
          fi
          if ! printf '%s' "$TOKEN" | grep -qE '^[A-Za-z0-9_-]{40,}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN does not look like a Cloudflare API token (expected 40+ characters: letters, digits, - or _)."
            echo "The real token is shown only once when created. To get a fresh copy: dash.cloudflare.com → profile icon → My Profile → API Tokens → next to 'simple-serve-deploy' open the ... menu → Roll → copy the NEW token shown."
            echo "Then update the secret: repo Settings → Secrets and variables → Actions → CLOUDFLARE_API_TOKEN (pencil icon)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create D1 database (first run only)
        run: npx wrangler@4 d1 create simple-serve-production || echo "database already exists"

      - name: Point wrangler.jsonc at the real database id
        run: |
          DB_ID=$(npx wrangler@4 d1 list --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const db=JSON.parse(s).find(d=>d.name==='simple-serve-production');
              if(!db){console.error('database not found');process.exit(1);}
              console.log(db.uuid);
            })")
          sed -i "s/placeholder-id/$DB_ID/" wrangler.jsonc
          echo "using database id $DB_ID"

      - name: Apply database migrations
        run: npx wrangler@4 d1 migrations apply simple-serve-production --remote

      - name: Create Pages project (first run only)
        run: npx wrangler@4 pages project create simple-serve --production-branch=main || echo "project already exists"

      - name: Stamp asset versions (cache busting)
        run: sed -i "s|/static/app.js|/static/app.js?v=${GITHUB_SHA::8}|; s|/static/style.css|/static/style.css?v=${GITHUB_SHA::8}|" public/index.html

      - name: Deploy
        run: npx wrangler@4 pages deploy public --project-name simple-serve --branch=main
