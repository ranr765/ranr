name: Reset transactions

# Clears ONLY transaction tables: sales, purchases, expenses, payments, orders.
# Master data stays: customers, suppliers, products, settings, login.
# Trigger: change the .ops/reset-transactions file on main (or run manually).

on:
  push:
    branches: [main]
    paths:
      - '.ops/reset-transactions'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  reset-transactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clear transaction tables
        run: npx wrangler@4 d1 execute simple-serve-production --remote --command "DELETE FROM sales; DELETE FROM purchases; DELETE FROM expenses; DELETE FROM payments; DELETE FROM orders;"

      - name: Done
        run: echo "All transactions cleared. Shops, suppliers, catalog, settings and login are untouched."
