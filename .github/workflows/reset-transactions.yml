name: Reset transactions

# Clears ONLY transaction tables: sales, purchases, expenses, payments, orders.
# Master data stays: customers, suppliers, products, settings, login.
# Trigger: change the .ops/reset-transactions file on main (or run manually).

on:
  push:
    branches: [main]
    paths:
      - '.ops/reset-transactions'
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  reset-transactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Point wrangler.jsonc at the real database id
        run: |
          DB_ID=$(npx wrangler@4 d1 list --json | node -e "
            let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
              const db=JSON.parse(s).find(d=>d.name==='simple-serve-production');
              if(!db){console.error('database not found');process.exit(1);}
              console.log(db.uuid);
            })")
          sed -i "s/placeholder-id/$DB_ID/" wrangler.jsonc

      - name: Clear transaction tables
        run: npx wrangler@4 d1 execute simple-serve-production --remote --command "DELETE FROM sales; DELETE FROM purchases; DELETE FROM expenses; DELETE FROM payments; DELETE FROM orders;"

      - name: Done
        run: echo "All transactions cleared. Shops, suppliers, catalog, settings and login are untouched."
