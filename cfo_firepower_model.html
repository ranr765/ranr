<style id="core-css">
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f6f8fc}

p{font-size:14px;line-height:1.45}

#hero .actions button{margin-left:8px}

#tabs button.active{color:var(--navy);border-bottom-color:var(--gold)}
#tabs button:hover{color:var(--navy)}
main{padding:18px 24px 60px 24px;max-width:1500px;margin:0 auto}
section.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(13,38,128,.05)}

.kpi.gold{background:linear-gradient(135deg,#8a6f33,#C5A572)}
.kpi.ice{background:var(--ice);color:var(--navy)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;opacity:.85}
.kpi .val{font-size:48px;font-weight:bold;line-height:1.05;margin-top:4px}
.kpi .sub{font-size:11px;opacity:.85;margin-top:2px}
.kpi.small .val{font-size:30px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:1100px){.grid-2,.grid-3{grid-template-columns:1fr}}
table.fin{width:100%;border-collapse:collapse;font-size:13px}
table.fin th,table.fin td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
table.fin th:first-child,table.fin td:first-child{text-align:left}
table.fin thead th{background:var(--ice);color:var(--navy);font-weight:bold;border-bottom:2px solid var(--steel)}
table.fin tr.total td{background:#f0f4fb;font-weight:bold;border-top:2px solid var(--steel)}
table.fin tr.subtotal td{font-weight:bold;color:var(--navy)}
table.fin tr.add td:first-child{padding-left:18px;color:#555}
table.fin tr.sub td:first-child{padding-left:18px;color:#555}
table.fin td.neg{color:var(--red)}
table.fin td.tooltip{position:relative;cursor:help;border-bottom:1px dotted var(--steel)}
.tooltip-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:6px 8px;border-radius:4px;font-size:11px;white-space:nowrap;display:none;z-index:5}
td.tooltip:hover .tooltip-tip{display:block}
.input-row{display:grid;grid-template-columns:220px 80px 1fr;align-items:center;gap:8px;margin:4px 0;font-size:13px}

<script id="compute">
// ============================================================
// FORMATTING HELPERS
// ============================================================
function fmt(n, dec=0){
  if(n===null||n===undefined||isNaN(n)) return "—";
  const sign = n<0;
  const abs = Math.abs(n);
  let s = abs.toFixed(dec);
  // Swiss apostrophe thousand separator
  const parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  s = parts.join(".");
  return sign ? `<span style="color:var(--red)">(${s})</span>` : s;
}
function fmtPct(n, dec=1){ if(n===null||isNaN(n)) return "—"; return n.toFixed(dec)+"%"; }
function fmtX(n, dec=2){ if(n===null||isNaN(n)) return "—"; return n.toFixed(dec)+"×"; }

// ============================================================
// COMPUTE — full year-by-year build
// ============================================================
function compute(){
  const m = {}, n=YEARS.length;
  const p = S.pl, t = S.toggles, b = S.bs2025;

  // Apply sensitivity shocks --------------------------------
  const sens = S.sens;
  const ebitdaShockMul = 1 + sens.ebitdaShock/100;
  const fxMul = 1 + sens.fxShock/100;       // affects translation of foreign debt & EBITDA
  const wcDaysShock = sens.wcDays;
  const capexMul = 1 + sens.capexShock/100;
  const payoutAdd = sens.payoutShock/100;
  const commodityHit = sens.commodityShock/100 * 0.4;  // ~40% pass-through to EBITDA

  // ---- 1. Revenue & reported EBITDA (with sensitivity) ----
  m.revenue = p.revenue.map(r=>r);
  m.ebitdaReported = YEARS.map((y,i)=>{
    const margin = p.ebitdaMargin[i] - commodityHit*100;
    return p.revenue[i]*margin/100 * ebitdaShockMul;
  });

  // ---- 2. EBITDA b.e.i. (S&P Adjusted) build --------------
  m.restruct = p.restructuring.slice();
  m.sbcAdd = p.sbc.map(v=> t.sbcAddBack ? v : 0);
  m.pensionSvc = p.pensionSvcAdj.slice();
  m.capDev = p.capDevCost.slice();
  m.ebitdaBEI = YEARS.map((_,i)=> m.ebitdaReported[i] + m.restruct[i] + m.sbcAdd[i] + m.pensionSvc[i] - m.capDev[i]);

  // ---- 3. Working capital movement (DSO/DPO/DIO) ----------
  m.nwc = YEARS.map((_,i)=>{
    const dso = p.dso[i] + wcDaysShock;
    const dpo = p.dpo[i] - wcDaysShock; // worsening = lower DPO
    const dio = p.dio[i] + wcDaysShock;
    const ar = p.revenue[i]*dso/365;
    const ap = p.revenue[i]*0.55 * dpo/365;       // assume 55% of revenue is COGS-payable
    const inv = p.revenue[i]*0.55 * dio/365;
    return ar + inv - ap;
  });
  m.nwcDelta = m.nwc.map((v,i)=> i===0 ? 0 : -(v - m.nwc[i-1]));  // negative = WC absorbs cash

  // ---- 4. Capex split & FOCF -----------------------------
  m.capexMaint = p.capexMaint.map(v=> v*capexMul);
  m.capexGrowth = p.capexGrowth.map(v=> v*capexMul);
  m.capexTotal = m.capexMaint.map((v,i)=> v + m.capexGrowth[i]);

  // ---- 5. Funds From Operations ---------------------------
  // Apply rate shock to cash interest (floating exposure)
  const rateAdd = sens.rateShockBps/10000 * b.floatingPct/100;
  m.cashInterest = p.cashInterest.map((v,i)=> v + (i>0 ? (m.netDebtPrior?m.netDebtPrior:0)*rateAdd : 0));
  m.cashTaxes = p.cashTaxes.slice();
  m.ffo = YEARS.map((_,i)=> m.ebitdaBEI[i] - m.cashInterest[i] - m.cashTaxes[i]);

  // ---- 6. FOCF & DCF -------------------------------------
  m.focf = YEARS.map((_,i)=> m.ffo[i] + m.nwcDelta[i] - m.capexTotal[i]);
  m.dividend = YEARS.map((_,i)=> p.dividend[i] * (1+payoutAdd));
  m.buyback = p.buyback.slice();
  m.pensionTopUp = p.pensionTopUp.slice();
  m.leasePrincipal = p.leasePrincipal.slice();
  m.restructCash = p.restructCash.slice();
  m.dcf = YEARS.map((_,i)=> m.focf[i] - m.dividend[i] - m.buyback[i] - m.pensionTopUp[i] - m.leasePrincipal[i] - m.restructCash[i]);

  // ---- 7. Scenario impacts -------------------------------
  m.scenCashImpact = YEARS.map(()=>0);
  m.scenDebtAdd = YEARS.map(()=>0);
  m.scenEbitdaAdd = YEARS.map(()=>0);
  m.scenEquityAdd = YEARS.map(()=>0);
  m.scenNotes = YEARS.map(()=>[]);

  applyMA(m); applyDiv(m); applyLit(m); applyRefi(m);

  // ---- 8. Cash & debt roll-forward -----------------------
  m.openingCash = YEARS.map(()=>0);
  m.closingCash = YEARS.map(()=>0);
  m.openingCash[0] = b.cashTotal;

  // Debt build per year (gross financial debt evolves with refi/M&A)
  m.grossDebt = YEARS.map(()=>0);
  let runningGross = b.bonds + b.termLoan + b.rcfDrawn + b.cpOutstanding + b.bilateralDrawn + b.schuldscheinOut + b.hybridOutstanding;
  for(let i=0;i<n;i++){
    if(i>0) m.openingCash[i] = m.closingCash[i-1];
    runningGross += m.scenDebtAdd[i];
    m.grossDebt[i] = runningGross * fxMul;  // FX translation
    m.closingCash[i] = m.openingCash[i] + m.dcf[i] + m.scenCashImpact[i] + m.scenEquityAdd[i];
  }

  // ---- 9. S&P-Adjusted Net Debt build -------------------
  m.leaseLiab = YEARS.map((_,i)=> b.leaseLiability * Math.pow(1.02, i));
  m.pensionDeficitGross = YEARS.map((_,i)=>{
    const discBps = sens.pensionDiscBps/10000;
    const dboMul = 1 - discBps*15;  // duration 15y, dDBO/DBO = -duration*dr
    const dbo = b.pensionDBO * dboMul;
    return Math.max(0, dbo - b.pensionAssets);
  });
  m.pensionAdj = m.pensionDeficitGross.map(v=> v * t.pensionHaircutPct/100 * 0.78); // post-tax @ 22%
  m.hybridAsDebt = YEARS.map(()=> b.hybridOutstanding * (1 - t.hybridEquityCredit/100));
  m.osbsItems = YEARS.map(()=> (t.factoringAsDebt? b.factoringRecourse:0) + b.securitisation + b.osbsGuarantees);
  m.aroAdj = YEARS.map(()=> b.arOblig);
  m.surplusCash = YEARS.map((_,i)=> m.closingCash[i] * (1 - t.cashHaircut/100));
  m.marketableSec = YEARS.map(()=> b.marketableSec);
  m.earnoutAdj = YEARS.map(()=> t.earnoutInDebt ? b.earnoutFV : 0);

  m.adjNetDebt = YEARS.map((_,i)=>
      m.grossDebt[i]
    + m.leaseLiab[i]
    + m.pensionAdj[i]
    + m.hybridAsDebt[i]
    + m.osbsItems[i]
    + m.aroAdj[i]
    + m.earnoutAdj[i]
    - m.surplusCash[i]
    - m.marketableSec[i]);

  // Three leverage views
  m.lev_primary = m.adjNetDebt.map((d,i)=> d / m.ebitdaBEI[i]);
  m.lev_bank    = YEARS.map((_,i)=> (m.grossDebt[i] + m.osbsItems[i] + m.aroAdj[i] - m.surplusCash[i] - m.marketableSec[i]) / m.ebitdaBEI[i]);
  m.lev_gross   = YEARS.map((_,i)=> (m.grossDebt[i] + m.leaseLiab[i] + m.pensionAdj[i] + m.hybridAsDebt[i]) / m.ebitdaBEI[i]);

  // Coverage ratios
  m.ffoNetDebt = YEARS.map((_,i)=> m.ffo[i] / m.adjNetDebt[i] * 100);
  m.ffoIntCov  = YEARS.map((_,i)=> (m.ffo[i] + m.cashInterest[i]) / m.cashInterest[i]);
  m.ebitdaIntCov = YEARS.map((_,i)=> m.ebitdaBEI[i] / m.cashInterest[i]);
  m.debtCap = YEARS.map((_,i)=> {
    const equity = (p.revenue[i]*0.6) - m.adjNetDebt[i]*0.3;  // illustrative book equity
    return m.adjNetDebt[i] / (m.adjNetDebt[i] + Math.max(500, equity)) * 100;
  });
  m.focfNetDebt = YEARS.map((_,i)=> m.focf[i] / m.adjNetDebt[i] * 100);
  m.dcfNetDebt  = YEARS.map((_,i)=> m.dcf[i] / m.adjNetDebt[i] * 100);
  m.cfoNetDebt  = YEARS.map((_,i)=> (m.ffo[i] + m.nwcDelta[i]) / m.adjNetDebt[i] * 100);

  // Rating per year
  m.rating = YEARS.map((_,i)=> deriveRating(m.lev_primary[i], m.ffoNetDebt[i]));

  // Liquidity
  const undrawnCommitted = (S.bs2025.rcfSize - S.bs2025.rcfDrawn) + 120;  // +securitisation undrawn
  m.totalLiquidity = m.closingCash.map(c=> c + undrawnCommitted);
  m.firepower = m.totalLiquidity.map(l=> l + 1500 /*bridge*/ + 600 /*equity*/ + 450 /*disposals*/);

  return m;
}

// ============================================================
// Scenario application
// ============================================================
function applyMA(m){
  const x = S.scen.ma; if(!x.on) return;
  const idx = YEARS.indexOf(x.year); if(idx<0) return;
  const equityFund = x.ev * x.mixEquity/100;
  const debtFund = x.ev * (x.mixDebt + x.mixHybrid)/100;
  const cashFund = x.ev * x.mixCash/100;
  const txCost = x.ev * x.txCostPct/100 + x.ev * x.stampDuty/100;
  m.scenCashImpact[idx] -= (cashFund + txCost + x.wcAbsorption);
  m.scenDebtAdd[idx] += debtFund;
  m.scenEquityAdd[idx] += equityFund;
  // Earnout
  if(x.earnout>0){
    const ei = YEARS.indexOf(x.earnoutYear);
    if(ei>=0) m.scenCashImpact[ei] -= x.earnout;
  }
  // Add target EBITDA + synergies phasing
  const phase = [x.synergyY1, x.synergyY2, x.synergyY3, 100, 100, 100];
  for(let i=idx;i<YEARS.length;i++){
    const k = i-idx;
    const synergy = x.synergyRR * (phase[Math.min(k,phase.length-1)]/100);
    const integ = (k===0) ? -x.synergyRR * x.integrationPct/100 : (k===1 ? -x.synergyRR*0.3 : 0);
    m.scenEbitdaAdd[i] += x.ebitda + synergy + integ;
    m.ebitdaBEI[i] += x.ebitda + synergy + integ;
  }
  m.scenNotes[idx].push(`M&A: ${x.target} EV ${fmt(x.ev)}`);
}

function applyDiv(m){
  const x = S.scen.div; if(!x.on) return;
  const idx = YEARS.indexOf(x.year); if(idx<0) return;
  const net = x.gross * (1 - x.taxLeakPct/100) - x.gross*x.txCostPct/100 - x.gross*x.carveOutPct/100 - x.pensionTransfer;
  m.scenCashImpact[idx] += net + x.wcRelease;
  // Use of proceeds (debt reduction reduces gross debt next year)
  if(x.useDebt) m.scenDebtAdd[idx] -= net*x.useDebt/100;
  if(x.useBuyback) m.scenCashImpact[idx] -= net*x.useBuyback/100;  // already subtracted via debt? no — cash impact net
  // EBITDA loss + stranded costs
  for(let i=idx;i<YEARS.length;i++){
    m.scenEbitdaAdd[i] -= x.ebitdaLost;
    m.ebitdaBEI[i] -= x.ebitdaLost;
    const k = i - idx;
    if(k < x.strandedYears){
      const stranded = x.ebitdaLost * x.strandedPct/100;
      m.scenEbitdaAdd[i] -= stranded;
      m.ebitdaBEI[i] -= stranded;
    }
    // TSA (small positive 12-24 months)
    if(k<2) m.scenEbitdaAdd[i] += x.tsaNet;
  }
  m.scenNotes[idx].push(`Divestment: ${x.asset} net ${fmt(net)}`);
}

function applyLit(m){
  const x = S.scen.lit; if(!x.on) return;
  const idx = YEARS.indexOf(x.year); if(idx<0) return;
  // Probability-weighted
  const pw = (x.probLow*x.low + x.probBase*x.base + x.probHigh*x.high)/100;
  const cashOut = pw - x.provisionBooked;
  m.scenCashImpact[idx] -= cashOut * (1 - x.taxDeductPct/100*0.22);
  // Insurance recovery lagged
  const recovery = pw * x.insRecoveryPct/100;
  const ri = Math.min(YEARS.length-1, idx + x.insLagYears);
  m.scenCashImpact[ri] += recovery;
  // Reputational EBITDA shock
  m.scenEbitdaAdd[idx] -= m.ebitdaBEI[idx] * x.reputationShockPct/100;
  m.ebitdaBEI[idx] -= m.ebitdaBEI[idx] * x.reputationShockPct/100;
  m.scenNotes[idx].push(`Litigation: prob-weighted ${fmt(pw)}`);
}

function applyRefi(m){
  const x = S.scen.refi; if(!x.on) return;
  const idx = YEARS.indexOf(x.year); if(idx<0) return;
  const tr = S.bs2025.maturities ? null : null;
  const tranche = S.maturities ? S.maturities.find(t=>t.instr===x.tranche) : null;
  // Simplified: shift interest cost
  const principal = 300;  // approx
  const intDelta = principal * x.spreadBps/10000;
  for(let i=idx;i<YEARS.length;i++){
    m.cashInterest[i] += intDelta;
  }
  m.scenCashImpact[idx] -= principal * x.feesPct/100;
  m.scenNotes[idx].push(`Refi: ${x.tranche} ${x.spreadBps>0?"+":""}${x.spreadBps}bps`);
}

// ============================================================
// Rating derivation
// ============================================================
function deriveRating(nde, ffoPct){
  // Take worst of two metrics
  let byLev=null, byFFO=null;
  for(const r of S.thresholds){ if(nde <= r.ndeMax){ byLev = r.rating; break; } }
  for(const r of S.thresholds){ if(ffoPct >= r.ffoMin){ byFFO = r.rating; break; } }
  // Pick the lower (more conservative)
  const order = S.thresholds.map(r=>r.rating);
  const a = order.indexOf(byLev||"BB-");
  const b = order.indexOf(byFFO||"BB-");
  return order[Math.max(a,b)];
}

function ratingToPosition(rating){
  // 0% = AAA (left), 100% = BB- (right)
  const order = S.thresholds.map(r=>r.rating);
  const idx = order.indexOf(rating);
  return idx<0 ? 100 : (idx/(order.length-1))*100;
}

function ratingHeadroom(m, year=2027){
  const i = YEARS.indexOf(year); if(i<0) return null;
  const ebit = m.ebitdaBEI[i];
  // EBITDA decline that pushes leverage to BBB- threshold (4.0x)
  const debt = m.adjNetDebt[i];
  const ebitToBBB = debt / 3.0; // BBB threshold
  const ebitToBBBm = debt / 4.0;
  return {
    pct_to_BBB: ((ebit - ebitToBBB)/ebit*100),
    pct_to_BBBm: ((ebit - ebitToBBBm)/ebit*100),
    chf_debt_room_BBB: ebit*3.0 - debt,
    chf_debt_room_BBBm: ebit*4.0 - debt
  };
}

function outlookFlag(m){
  const trend = m.lev_primary[5] - m.lev_primary[0];
  if(trend < -0.3) return {label:"Positive", cls:"green"};
  if(trend > 0.3)  return {label:"Negative", cls:"red"};
  return {label:"Stable", cls:"blue"};
}

function liquidityRunway(m){
  // Months of debt service + opex covered by liquidity
  const monthlyOpex = (m.revenue[0]*0.85)/12;
  const monthlyDebtSvc = (m.cashInterest[0] + m.leasePrincipal[0])/12;
  const liquidity = m.totalLiquidity[0];
  return liquidity / (monthlyOpex*0.15 + monthlyDebtSvc); // 15% opex coverage assumption
}

function nearestMaturity(){
  const sorted = [...S.maturities].sort((a,b)=>a.year-b.year);
  return sorted[0];
}
</script>
<script id="render">

  {id:"bench",   label:"Benchmarking",        fn:renderBench},

];
let activePanel = "summary";

function renderTabs(){
  const nav = document.getElementById("tabs");
  nav.innerHTML = PANELS.map(p=>`<button data-tab="${p.id}" class="${p.id===activePanel?'active':''}">${p.label}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{ activePanel = b.dataset.tab; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); };
  });
}

function renderAll(){
  const m = compute();
  renderTabs();
  const app = document.getElementById("app");
  // Render every panel but hide non-active ones — print view shows all
  app.innerHTML = PANELS.map(p=>`<section class="panel ${p.id===activePanel?'':'hidden'} ${['core','cash','sources','scen'].includes(p.id)?'major-break':''}" id="panel-${p.id}"></section>`).join("");
  PANELS.forEach(p=>{ try{ p.fn(document.getElementById("panel-"+p.id), m); }catch(e){ console.error(p.id, e); } });
  hookGlobalEvents();
  renderCharts(m);
  saveState();
}

// Generic input helper — wires numeric+slider, persists, recomputes
function inputCtl(path, label, opts={}){
  const {min=0, max=100, step=1, unit="", slider=true} = opts;
  const id = "i_"+path.replace(/[\.\[\]]/g,"_");
  let val = path.split(/[\.\[\]]+/).filter(x=>x).reduce((o,k)=> o[isNaN(k)?k:Number(k)], S);
  if(typeof val !== "number") val = 0;
  return `<div class="input-row">
    <label title="${path}">${label}</label>
    <input type="number" id="${id}_n" value="${val}" min="${min}" max="${max}" step="${step}" data-path="${path}" />
    ${slider?`<input type="range" id="${id}_r" value="${val}" min="${min}" max="${max}" step="${step}" data-path="${path}" />`:`<span class="unit">${unit}</span>`}
  </div>`;
}
function arrInputCtl(arrPath, label, opts={}){
  const arr = arrPath.split(".").reduce((o,k)=> o[k], S);
  const cells = arr.map((v,i)=>`<input type="number" data-path="${arrPath}[${i}]" value="${v}" step="${opts.step||1}" style="width:60px;padding:3px;border:1px solid var(--line);border-radius:3px;text-align:right;font-size:12px"/>`).join("");
  return `<tr><td style="font-size:12px;color:#444">${label}</td>${arr.map((_,i)=>`<td>${cells.split('><').slice(i,i+1).map(c=> '<'+c.split('<').filter(x=>x).join('<') ).join('')}</td>`).join("")}</tr>`;
}
// Simpler array input row
function arrRow(arrPath, label, step=1, dec=0){
  const arr = arrPath.split(".").reduce((o,k)=> o[k], S);
  const tds = arr.map((v,i)=>`<td><input type="number" data-path="${arrPath}[${i}]" value="${v}" step="${step}" style="width:62px;padding:3px;border:1px solid var(--line);border-radius:3px;text-align:right;font-size:12px"/></td>`).join("");
  return `<tr><td style="font-size:12px;color:#444">${label}</td>${tds}</tr>`;
}

// Generic event wiring after render
function hookGlobalEvents(){
  document.querySelectorAll("input[data-path]").forEach(el=>{
    el.oninput = (e)=>{
      const path = el.dataset.path;
      const v = parseFloat(el.value);
      if(isNaN(v) && el.type==="number") return;
      setByPath(S, path, isNaN(v)?el.value:v);
      // mirror paired controls
      document.querySelectorAll(`input[data-path="${path}"]`).forEach(o=>{ if(o!==el) o.value = el.value; });
      renderAll();
    };
  });
  document.querySelectorAll("input[type=checkbox][data-toggle]").forEach(el=>{
    el.onchange = ()=>{
      const path = el.dataset.toggle;
      setByPath(S, path, el.checked);
      renderAll();
    };
  });
  document.querySelectorAll("input[type=text][data-text]").forEach(el=>{
    el.oninput = ()=>{ setByPath(S, el.dataset.text, el.value); };
  });
  document.querySelectorAll("select[data-path]").forEach(el=>{
    el.onchange = ()=>{ setByPath(S, el.dataset.path, el.value); renderAll(); };
  });
}
function setByPath(obj, path, v){
  const parts = path.split(/[\.\[\]]+/).filter(x=>x);
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    const k = isNaN(parts[i]) ? parts[i] : Number(parts[i]);
    o = o[k];
  }
  const last = parts[parts.length-1];
  o[isNaN(last)?last:Number(last)] = v;
}

function rowR(label, arr, cls=""){
  return `<tr class="${cls}"><td>${label}</td>${arr.map(v=>`<td>${fmt(v,0)}</td>`).join("")}</tr>`;
}
function rowX(label, arr, cls=""){
  return `<tr class="${cls}"><td>${label}</td>${arr.map(v=>`<td>${fmtX(v)}</td>`).join("")}</tr>`;
}
function rowPct(label, arr, cls=""){
  return `<tr class="${cls}"><td>${label}</td>${arr.map(v=>`<td>${fmtPct(v)}</td>`).join("")}</tr>`;
}
function ratingBandCls(r){
  if(["AAA","AA","A","BBB+"].includes(r)) return "green";
  if(["BBB","BBB-"].includes(r)) return "blue";
  if(["BB+","BB"].includes(r)) return "amber";
  return "red";
}

function decideVerdict(m){
  const lev27 = m.lev_primary[2];
  const ffo27 = m.ffoNetDebt[2];
  const liqOK = m.totalLiquidity[0] >= S.modifiers.minLiquidityFloor;
  const recoverByEnd = m.lev_primary[5] < S.policy.bbbAnchorNDE && m.ffoNetDebt[5] >= S.policy.bbbAnchorFFO;
  if(lev27 < S.policy.bbbAnchorNDE && ffo27 >= S.policy.bbbAnchorFFO && liqOK){
    return {cls:"green", label:"GREEN — Within rating envelope",
      text:`2027 leverage ${fmtX(lev27)} below BBB anchor ${fmtX(S.policy.bbbAnchorNDE)}; FFO/Net Debt ${fmtPct(ffo27)} above ${S.policy.bbbAnchorFFO}%. Liquidity floor satisfied. No rating action expected.`};
  }
  if(lev27 < S.policy.deferMaNDE && recoverByEnd && liqOK){
    return {cls:"amber", label:"AMBER — Rating pressure, recoverable in 24 months",
      text:`2027 leverage ${fmtX(lev27)} above BBB anchor; trajectory recovers to BBB envelope by 2030. Defer transformational M&A; monitor buyback pace.`};
  }
  return {cls:"red", label:"RED — Rating downgrade likely / liquidity risk",
    text:`Combined scenarios drive 2027 leverage to ${fmtX(lev27)}; FFO/Net Debt ${fmtPct(ffo27)}. ${liqOK?"":"Liquidity falls below floor. "}Equity raise, accelerated divestment or scenario reversal warranted.`};
}

  // Compute single-variable impacts on 2027 leverage

    const saved = JSON.parse(JSON.stringify(S.sens));
    Object.assign(S.sens, patch);
    const r = compute();
    S.sens = saved;
    return r.lev_primary[2];
  }
  const base27 = m.lev_primary[2];
  const tornado = [
    {v:"EBITDA −20%", neg:withSens({ebitdaShock:-20})-base27, pos:withSens({ebitdaShock:20})-base27, label:"EBITDA ±20%"},

    {v:"Pension disc ±50bps",neg:withSens({pensionDiscBps:-50})-base27, pos:withSens({pensionDiscBps:50})-base27, label:"Pension disc rate ±50bps"},
    {v:"Capex ±20%", neg:withSens({capexShock:-20})-base27, pos:withSens({capexShock:20})-base27, label:"Capex ±20%"},
    {v:"Payout ±10pp",neg:withSens({payoutShock:-10})-base27, pos:withSens({payoutShock:10})-base27, label:"Dividend payout ±10pp"},

function heatmapCell(cagr, deployment){
  // simulate ending leverage
  const saved = JSON.parse(JSON.stringify(S));
  // EBITDA CAGR override
  const baseE = S.pl.revenue[0]*S.pl.ebitdaMargin[0]/100;
  for(let i=1;i<YEARS.length;i++){
    const factor = Math.pow(1+cagr/100, i);
    S.pl.ebitdaMargin[i] = (baseE*factor) / S.pl.revenue[i] * 100;
  }
  // Deployment in 2027 (year index 2)
  S.pl.buyback[2] += deployment;  // crude proxy
  const r = compute();
  const lev = r.lev_primary[5];
  const rating = r.rating[5];
  S = saved;
  return {lev, rating};
}

function computeStress(){
  const saved = JSON.parse(JSON.stringify(S.sens));
  const savedM = JSON.parse(JSON.stringify(S.pl.ebitdaMargin));
  S.pl.ebitdaMargin[1] = S.pl.ebitdaMargin[0] * 0.75;
  S.pl.ebitdaMargin[2] = S.pl.ebitdaMargin[0] * 0.90;
  const r = compute();
  S.sens = saved;
  S.pl.ebitdaMargin = savedM;
  return {
    lev27: r.lev_primary[1],
    lev28: r.lev_primary[2],
    lev28Bank: r.lev_bank[2],
    rating: r.rating[2],
    runway: r.totalLiquidity[1] / 60   // crude monthly burn
  };
}

function dynamicCommentary(m){
  const parts = [];
  const events = [];
  if(S.scen.ma.on)  events.push(`M&A ${S.scen.ma.target} (${fmt(S.scen.ma.ev)})`);
  if(S.scen.div.on) events.push(`Divestment ${S.scen.div.asset} (gross ${fmt(S.scen.div.gross)})`);
  if(S.scen.lit.on) events.push(`Litigation ${S.scen.lit.desc}`);
  if(S.scen.refi.on)events.push(`Refi ${S.scen.refi.tranche}`);
  if(events.length){
    parts.push(`<strong>Active scenarios:</strong> ${events.join(" + ")}.`);
  } else {
    parts.push("<strong>Base case</strong> — no scenarios active.");
  }
  // Peak leverage
  const maxLev = Math.max(...m.lev_primary);
  const peakYear = YEARS[m.lev_primary.indexOf(maxLev)];
  parts.push(`Peak S&P-adjusted leverage: <strong>${fmtX(maxLev)} in ${peakYear}</strong> (rating ${m.rating[m.lev_primary.indexOf(maxLev)]}).`);
  // Anchor breach
  if(maxLev > S.policy.bbbAnchorNDE){
    parts.push(`<span style="color:var(--red)">Breach of BBB anchor (${fmtX(S.policy.bbbAnchorNDE)}) by ${fmtX(maxLev - S.policy.bbbAnchorNDE)}.</span>`);
  }
  // Recovery
  if(m.lev_primary[5] < S.policy.bbbAnchorNDE){
    parts.push(`Recovery to BBB envelope by 2030 (${fmtX(m.lev_primary[5])}).`);
  } else {
    parts.push(`<span style="color:var(--red)">No recovery to BBB envelope by 2030 (${fmtX(m.lev_primary[5])}).</span>`);
  }
  // Headroom
  const hr = ratingHeadroom(m, 2027);
  if(hr) parts.push(`Headroom @ 2027: ${fmt(hr.chf_debt_room_BBB)} CHF m of additional debt before BBB anchor breach.`);
  return parts.join(" ");
}

    const ds = types.map((tp,idx)=>({
      label:tp.toUpperCase(),
      data:allYears.map(y=> S.maturities.filter(t=>t.type===tp && t.year.toString()===y).reduce((a,t)=>a+t.amount,0)),
      backgroundColor:[CC.navy,CC.steel,CC.gold,CC.amber][idx],
      stack:"m"
    }));
    makeChart("ch-maturity", {type:"bar", data:{labels:allYears, datasets:ds},
      options:{maintainAspectRatio:false, plugins:{legend:{position:"bottom"}}, scales:{x:{stacked:true}, y:{stacked:true}}}
    });
  }

  // Currency mix
  if(document.getElementById("ch-ccy-debt")){
    const ccyMix = {};
    S.maturities.forEach(t=>{ ccyMix[t.ccy]=(ccyMix[t.ccy]||0)+t.amount; });
    makeChart("ch-ccy-debt", {type:"doughnut",
      data:{labels:Object.keys(ccyMix), datasets:[{data:Object.values(ccyMix), backgroundColor:[CC.navy,CC.steel,CC.gold,CC.amber,"#7d8ba5"]}]},
      options:{maintainAspectRatio:false, plugins:{legend:{position:"right"}}}
    });
  }
  if(document.getElementById("ch-ccy-ebitda")){
    makeChart("ch-ccy-ebitda", {type:"doughnut",
      data:{labels:["EUR","USD","CHF","Asia","RoW"], datasets:[{data:[35,28,22,10,5], backgroundColor:[CC.navy,CC.steel,CC.gold,CC.amber,"#7d8ba5"]}]},
      options:{maintainAspectRatio:false, plugins:{legend:{position:"right"}}}
    });
  }

  // Scenario base vs current
  if(document.getElementById("ch-scen-lev")){
    const saved = JSON.parse(JSON.stringify(S.scen));
    S.scen.ma.on=false; S.scen.div.on=false; S.scen.lit.on=false; S.scen.refi.on=false;
    const baseRun = compute();
    S.scen = saved;
    makeChart("ch-scen-lev", {type:"line",
      data:{labels, datasets:[
        {label:"Base case", data:baseRun.lev_primary, borderColor:CC.steel, borderDash:[4,4], tension:.3},
        {label:"Scenario combined", data:m.lev_primary, borderColor:CC.navy, tension:.3, fill:true, backgroundColor:"rgba(13,38,128,.1)"},
        {label:"BBB anchor", data:labels.map(()=>S.policy.bbbAnchorNDE), borderColor:CC.amber, borderDash:[2,2], pointRadius:0}
      ]},
      options:{maintainAspectRatio:false, plugins:{legend:{position:"bottom"}}}
    });
  }
  if(document.getElementById("ch-scen-cash")){
    const saved = JSON.parse(JSON.stringify(S.scen));
    S.scen.ma.on=false; S.scen.div.on=false; S.scen.lit.on=false; S.scen.refi.on=false;
    const baseRun = compute();
    S.scen = saved;
    makeChart("ch-scen-cash", {type:"line",
      data:{labels, datasets:[
        {label:"Base closing cash", data:baseRun.closingCash, borderColor:CC.steel, borderDash:[4,4], tension:.3},
        {label:"Scenario closing cash", data:m.closingCash, borderColor:CC.navy, tension:.3, fill:true, backgroundColor:"rgba(13,38,128,.1)"}
      ]},
      options:{maintainAspectRatio:false, plugins:{legend:{position:"bottom"}}}
    });
  }

  // Peer scatter
  if(document.getElementById("ch-peer-scatter")){
    const ourNDE = m.lev_primary[0], ourFFO = m.ffoNetDebt[0];
    makeChart("ch-peer-scatter", {type:"scatter",
      data:{datasets:[
        {label:"Peers", data:S.peers.map(p=>({x:p.nde, y:p.ffo, name:p.name})), backgroundColor:CC.steel, pointRadius:6},
        {label:"ABC LTD", data:[{x:ourNDE, y:ourFFO}], backgroundColor:CC.gold, pointRadius:10, pointStyle:"rectRot"}
      ]},
      options:{maintainAspectRatio:false, plugins:{legend:{position:"bottom"},
        tooltip:{callbacks:{label:(c)=>{ const p = c.raw; return `${p.name||'ABC LTD'}: ${p.x.toFixed(2)}× / ${p.y.toFixed(0)}%`; }}}},
        scales:{x:{title:{display:true,text:"ND/EBITDA"}}, y:{title:{display:true,text:"FFO/Net Debt %"}}}
      }
    });
  }
  if(document.getElementById("ch-peer-bar")){
    const labels2 = [...S.peers.map(p=>p.name), "ABC LTD"];
    const data = [...S.peers.map(p=>p.nde), m.lev_primary[0]];
    const colors = labels2.map(n => n==="ABC LTD" ? CC.gold : CC.steel);
    makeChart("ch-peer-bar", {type:"bar",
      data:{labels:labels2, datasets:[{label:"ND/EBITDA", data, backgroundColor:colors}]},
      options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, indexAxis:"y"}
    });
  }
}
</script>
<script id="boot">
// ============================================================
// BOOT — wire toolbar, persistence, export, print
// ============================================================
function exportCSV(){
  const m = compute();
  const lines = [];
  lines.push("ABC LTD — CFO Firepower Model — Export");
  lines.push("Generated,"+new Date().toISOString());
  lines.push("");
  lines.push("Metric,"+YEARS.join(","));
  const rows = [
    ["Revenue", m.revenue],
    ["Reported EBITDA", m.ebitdaReported],
    ["EBITDA b.e.i. (S&P Adj)", m.ebitdaBEI],
    ["FFO", m.ffo],
    ["FOCF", m.focf],
    ["DCF", m.dcf],
    ["Closing cash", m.closingCash],
    ["Gross debt", m.grossDebt],
    ["Adjusted Net Debt", m.adjNetDebt],
    ["ND/EBITDA primary", m.lev_primary],
    ["ND/EBITDA bank view", m.lev_bank],
    ["FFO/Net Debt %", m.ffoNetDebt],
    ["FFO Interest Cover", m.ffoIntCov],
    ["EBITDA Interest Cover", m.ebitdaIntCov],
    ["FOCF/Net Debt %", m.focfNetDebt],
    ["DCF/Net Debt %", m.dcfNetDebt],
    ["Total liquidity", m.totalLiquidity],
    ["Firepower", m.firepower],
    ["Implied rating", m.rating]
  ];
  rows.forEach(r => lines.push(r[0]+","+r[1].map(v=>typeof v==="number"?v.toFixed(2):v).join(",")));
  const csv = lines.join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "abc_ltd_firepower_export.csv"; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function init(){
  loadState();
  document.getElementById("gen-date").textContent = new Date().toLocaleDateString();
  document.getElementById("btn-print").onclick = ()=> window.print();
  document.getElementById("btn-csv").onclick = exportCSV;
  document.getElementById("btn-reset").onclick = ()=>{ if(confirm("Reset all inputs to base assumptions?")) resetState(); };
  renderAll();
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
